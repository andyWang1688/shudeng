<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书灯 · 视觉系统 v1 · 纸与灯</title>
<style>
/* ============================================================
   书灯视觉系统 v1 — "纸与灯 / Paper & Lamp"
   Self-contained design board. No network, no webfonts.
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#EFEAE0;color:#211E18;
  font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body.doc-dark{background:#121110;color:#F3EEE3}
a{color:inherit}
.doc{max-width:1280px;margin:0 auto;padding:52px 40px 96px}
.doc h1{font:600 42px/1.18 "Songti SC","STSong",serif;margin:0 0 10px;letter-spacing:.01em}
.doc .lede{font-size:15px;line-height:1.75;opacity:.72;max-width:760px;margin:0}
.doc .doc-meta{font-size:11.5px;font-weight:500;letter-spacing:.08em;opacity:.45;margin-top:14px}
.doc .sword{font:600 21px/1.35 "Songti SC",serif;margin:60px 0 6px}
.doc .snote{font-size:13px;line-height:1.7;opacity:.62;margin:0 0 20px;max-width:800px}
.doc-dark .sword,.doc-dark .doc h1{color:#F3EEE3}
.doc-dark .snote,.doc-dark .lede{color:#C3BCAE;opacity:1}
.panel{background:#FAF7F1;border-radius:16px;padding:26px;box-shadow:0 1px 2px rgba(33,30,24,.06),0 10px 30px -24px rgba(33,30,24,.35)}
.doc-dark .panel{background:#1B1A17;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.panel h3{font:600 15px/1.4 "Songti SC",serif;margin:0 0 14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:999px;background:#F2EDE2;color:#57534A;font-size:12px;font-weight:500}
.doc-dark .tag{background:#24221E;color:#C3BCAE}

/* ---------- device frames & board ---------- */
.board-section{margin-top:8px}
.board-head{display:flex;align-items:baseline;gap:14px;margin:0 0 18px}
.board-head h2{font:600 21px/1.3 "Songti SC",serif;margin:0}
.board-head p{font-size:12.5px;opacity:.55;margin:0}
.board{display:grid;grid-template-columns:repeat(3,375px);gap:30px 26px}
.board.w390{grid-template-columns:repeat(3,390px)}
.dev{display:flex;flex-direction:column;gap:10px}
.dev figcaption{font-size:11.5px;font-weight:500;letter-spacing:.06em;opacity:.5}
.phone{
  position:relative;width:375px;height:667px;overflow:hidden;border-radius:26px;
  background:#FAF7F1;color:#211E18;
  box-shadow:0 0 0 1px rgba(20,16,10,.10),0 22px 48px -24px rgba(30,25,18,.45);
  isolation:isolate;
}
.phone[data-theme="dark"]{background:#1B1A17;color:#F3EEE3}
.phone[data-size="390"]{width:390px;height:844px;border-radius:30px}

/* ---------- tokens inside a phone ---------- */
.phone{
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
  --paper:#FAF7F1;--paper-deep:#F2EDE2;--surface:#FFFFFF;
  --ink:#211E18;--ink-2:#57534A;--ink-3:#6E6A60;
  --line:rgba(33,30,24,.10);
  --lamp:#B4712A;--lamp-ink:#8A5413;--lamp-wash:#F6E7CC;
  --selection:#F2DBA6;--error:#A63A2B;--error-wash:#F8E7E1;
  --shadow-1:0 1px 2px rgba(33,30,24,.07),0 1px 1px rgba(33,30,24,.04);
  --shadow-2:0 14px 34px -12px rgba(33,30,24,.26),0 2px 6px rgba(33,30,24,.07);
  --r-cover:4px;--r-sm:10px;--r-md:14px;--r-lg:22px;--r-pill:999px;
  --scrim:rgba(24,21,17,.20);
  font-family:var(--sans);
}
.phone[data-theme="dark"]{
  --paper:#1B1A17;--paper-deep:#24221E;--surface:#2A2723;
  --ink:#F3EEE3;--ink-2:#C3BCAE;--ink-3:#948D80;
  --line:rgba(243,238,227,.11);
  --lamp:#E0AE6A;--lamp-ink:#F0C98B;--lamp-wash:#3A2F1F;
  --selection:#5A4A2A;--error:#F0A79A;--error-wash:#3A2823;
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 14px 34px -10px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.38);
}

/* ---------- screen chrome ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.status{flex:none;height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font:600 11px/1 var(--sans);color:var(--ink)}
.status .glyphs{display:flex;align-items:center;gap:5px}
.status svg{display:block}
.status-overlay{position:absolute;top:0;left:0;right:0;height:20px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;font:600 11px/1 var(--sans);color:var(--ink)}
.content{flex:1;overflow:hidden;position:relative}
.tabs{flex:none;height:56px;display:flex;align-items:stretch;padding:5px 6px 6px;border-top:1px solid var(--line);background:var(--paper)}
.phone[data-size="390"] .tabs{height:90px;padding-bottom:34px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font:500 10px/1 var(--sans);letter-spacing:.02em}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--ink)}
.home{position:absolute;z-index:12;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.8;display:none}
.phone[data-size="390"] .home{display:block}

/* ---------- shared ---------- */
.ic{width:20px;height:20px;flex:none}
.ghost{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ghost .ic{width:19px;height:19px}
.ghost.solid{background:var(--ink);color:var(--paper)}
.ghost.solid .ic{width:18px;height:18px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 20px 0}
.hdr h1{margin:0;font:600 30px/1.16 var(--serif);letter-spacing:.015em;color:var(--ink)}
.hdr .actions{display:flex;gap:4px;margin-right:-6px}
.search{margin:11px 20px 0;height:38px;border-radius:var(--r-sm);background:var(--paper-deep);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink-3)}
.search .ic{width:15px;height:15px}
.search span{font:400 13px/1 var(--sans)}
.chips{display:flex;gap:8px;padding:11px 20px 0}
.chip{height:28px;padding:0 13px;border-radius:var(--r-pill);background:var(--paper-deep);color:var(--ink-2);font:500 12px/28px var(--sans);display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--paper)}
.hairline{height:1px;background:var(--line);flex:none}
.press{transition:opacity .16s ease,transform .16s ease}

/* ---------- covers (typographic jacket system) ---------- */
.cover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;border-radius:var(--r-cover);padding:15px 14px;box-shadow:var(--shadow-1)}
.cover::after{content:"";position:absolute;inset:6px;border:1px solid currentColor;opacity:.16;border-radius:2px;pointer-events:none}
.cover .tt{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.32;letter-spacing:.06em}
.cover .dv{width:14px;height:1px;background:currentColor;opacity:.42;margin:8px 0 7px}
.cover .au{font-family:var(--sans);font-size:8px;font-weight:500;letter-spacing:.02em;opacity:.76}
.cover .mk{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.42}
.cover.sm .tt{font-size:11px;letter-spacing:.04em}
.cover.sm .dv{width:9px;margin:5px 0 4px}
.cover.sm .au{font-size:6.5px}
.cover.sm .mk{width:4px;height:4px;bottom:6px}
.cover.sm{padding:9px 7px}
.cover.sm::after{inset:4px}
.cover.jade{background:linear-gradient(155deg,#38483F 0%,#2B372F 100%);color:#F1EAD9}
.cover.ochre{background:linear-gradient(155deg,#8F5336 0%,#7A4229 100%);color:#F7EBDF}
.cover.indigo{background:linear-gradient(155deg,#3A4653 0%,#2C3741 100%);color:#EFF0E8}
.cover.parchment{background:linear-gradient(155deg,#F0E5CE 0%,#E6D8BC 100%);color:#3B332A}
.cover.parchment::after{opacity:.22}
.cover.parchment .mk{border:1px solid currentColor;background:none;opacity:.4}
.grid .cover .tt{font-size:19px;letter-spacing:.08em}

/* ---------- shelf ---------- */
.hero{margin:13px 20px 0;background:var(--paper-deep);border-radius:var(--r-md);padding:12px;display:flex;gap:13px}
.hero .cover{width:64px;height:90px;flex:none}
.hero .meta{flex:1;min-width:0;display:flex;flex-direction:column;padding:2px 0 1px}
.hero .eyebrow{font:500 10.5px/1 var(--sans);letter-spacing:.07em;color:var(--lamp-ink)}
.hero h2{margin:7px 0 3px;font:600 20px/1.25 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .writer{font:400 12px/1.2 var(--sans);color:var(--ink-3)}
.hero .grow{flex:1}
.hero .prog{height:2px;border-radius:2px;background:rgba(33,30,24,.12);overflow:hidden}
.phone[data-theme="dark"] .hero .prog{background:rgba(243,238,227,.14)}
.hero .prog i{display:block;height:100%;width:12%;border-radius:2px;background:var(--lamp)}
.hero .foot{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.hero .foot .go{font:500 12.5px/1 var(--sans);color:var(--lamp-ink);display:flex;align-items:center;gap:4px}
.hero .foot .go .ic{width:13px;height:13px}
.hero .foot .pct{font:500 10.5px/1 var(--sans);color:var(--ink-3)}
.sec{display:flex;align-items:baseline;gap:7px;padding:18px 20px 0}
.sec h2{margin:0;font:600 16.5px/1.2 var(--serif);color:var(--ink)}
.sec .count{font:400 11.5px/1 var(--sans);color:var(--ink-3)}
.sec .sort{margin-left:auto;font:400 11.5px/1 var(--sans);color:var(--ink-2);display:flex;align-items:center;gap:2px}
.sec .sort .ic{width:12px;height:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 16px;padding:11px 20px 0}
.book .cover{width:100%;aspect-ratio:0.714}
.book h3{margin:8px 0 2px;font:600 14px/1.34 var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .au{font:400 10.5px/1.3 var(--sans);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .st{margin-top:3px;font:500 10.5px/1.3 var(--sans);color:var(--ink-3)}
.book .st.read{color:var(--lamp-ink)}
.fade-bottom{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(to bottom,transparent,var(--paper));pointer-events:none}

/* ---------- reader ---------- */
.reader{position:absolute;inset:0;background:var(--paper);overflow:hidden}
.rbar{position:absolute;top:0;left:0;right:0;height:64px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:20px 12px 0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.rbar .mid{text-align:center;line-height:1.25}
.rbar .mid b{display:block;font:500 12px/1.25 var(--sans);color:var(--ink-2);letter-spacing:.02em}
.rbar .mid span{display:block;font:400 10px/1.4 var(--sans);color:var(--ink-3)}
.rbar .side{display:flex;align-items:center;gap:2px}
.rpage{position:absolute;top:64px;left:0;right:0;bottom:0;padding:20px 28px 96px}
.rkicker{font:500 10.5px/1 var(--sans);letter-spacing:.18em;color:var(--lamp-ink);text-align:center}
.rchapter{margin:9px 0 18px;font:600 24px/1.35 var(--serif);color:var(--ink);text-align:center;letter-spacing:.02em}
.rbody{font:400 18.5px/32px var(--serif);color:var(--ink);text-align:justify}
.rbody p{margin:0 0 10px;text-indent:2em}
.rbody .hl{background:var(--selection);border-radius:2px;box-shadow:0 0 0 2px var(--selection)}
.rpill{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:4;height:42px;padding:0 17px 0 13px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-2);display:flex;align-items:center;gap:8px;color:var(--ink);font:500 13px/1 var(--sans)}
.rpill .ic{width:18px;height:18px;color:var(--lamp)}
.rfoot{position:absolute;left:0;right:0;bottom:0;height:76px;z-index:2;padding:0 26px 16px;display:flex;align-items:flex-end;justify-content:space-between;background:linear-gradient(to bottom,transparent,var(--paper) 62%);font:400 10.5px/1.3 var(--sans);color:var(--ink-3)}
.rfoot .pct{font-weight:500;color:var(--ink-2)}

/* ---------- ask sheet ---------- */
.askwrap{position:absolute;inset:0;background:rgba(27,24,19,.30)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:76%;background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:0 -18px 50px -20px rgba(20,16,10,.45);display:flex;flex-direction:column;overflow:hidden}
.sheet .handle{flex:none;height:20px;display:flex;align-items:center;justify-content:center}
.sheet .handle i{width:34px;height:4px;border-radius:2px;background:var(--ink-3);opacity:.35}
.shead{flex:none;display:flex;align-items:center;gap:10px;padding:0 18px 10px}
.lampmark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 42%,var(--lamp-wash) 0%,var(--paper) 78%);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.lampmark .ic{width:16px;height:16px;color:var(--lamp)}
.shead b{display:block;font:600 15.5px/1.2 var(--serif);color:var(--ink)}
.shead span{display:block;font:400 10.5px/1.4 var(--sans);color:var(--ink-3);margin-top:1px}
.shead .ghostx{margin-left:auto;width:30px;height:30px}
.msgs{flex:1;overflow:hidden;padding:4px 18px 6px;display:flex;flex-direction:column;gap:12px;-webkit-mask-image:linear-gradient(to bottom,#000 93%,transparent 100%);mask-image:linear-gradient(to bottom,#000 93%,transparent 100%)}
.ume{align-self:flex-end;max-width:86%}
.ume .bubble{background:var(--paper-deep);border-radius:var(--r-md) var(--r-md) 6px var(--r-md);padding:9px 11px 10px}
.ume .q{border-left:2px solid var(--lamp);padding-left:9px;margin-bottom:7px;font:400 13px/21px var(--serif);color:var(--ink-2)}
.ume .t{font:400 14.5px/22px var(--sans);color:var(--ink)}
.ume .stamp{text-align:right;font:400 10px/1.4 var(--sans);color:var(--ink-3);margin-top:4px}
.aime{align-self:flex-start;max-width:94%}
.role{display:flex;align-items:center;gap:6px;font:500 10.5px/1 var(--sans);letter-spacing:.04em;color:var(--ink-2);margin-bottom:5px}
.role i{width:5px;height:5px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px var(--lamp-wash)}
.aime .body{font:400 15px/25px var(--sans);color:var(--ink)}
.aime .body sup{font:600 9.5px/1 var(--sans);color:var(--lamp-ink);padding-left:1px;vertical-align:super}
.evidence{margin-top:9px}
.evidence .lab{font:500 10px/1 var(--sans);letter-spacing:.1em;color:var(--ink-3);margin-bottom:6px}
.evrow{display:flex;gap:8px}
.evcard{flex:1;min-width:0;background:var(--surface);border-radius:var(--r-sm);padding:8px 9px;box-shadow:var(--shadow-1)}
.evcard .top{display:flex;align-items:center;gap:7px}
.mini{width:14px;height:19px;border-radius:2px;flex:none}
.evcard .bk{font:600 11.5px/1.2 var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evcard .ch{font:400 9.5px/1.3 var(--sans);color:var(--ink-3);margin-top:2px}
.evcard .qt{margin-top:5px;font:400 10.5px/16px var(--serif);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.composer{flex:none;border-top:1px solid var(--line);padding:8px 16px 14px;background:var(--paper)}
.scope{display:flex;align-items:center;gap:3px;font:400 10px/1 var(--sans);color:var(--ink-3);padding:0 2px 7px}
.scope .ic{width:10px;height:10px}
.inrow{display:flex;align-items:center;gap:9px}
.field{flex:1;height:40px;border-radius:var(--r-pill);background:var(--paper-deep);display:flex;align-items:center;padding:0 15px;font:400 13px/1 var(--sans);color:var(--ink-3)}
.send{width:34px;height:34px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--paper);flex:none}
.send .ic{width:16px;height:16px}

/* ---------- notes ---------- */
.notegroup{display:flex;align-items:center;gap:9px;padding:16px 20px 0}
.notegroup .mini{width:12px;height:16px}
.notegroup b{font:600 12.5px/1.2 var(--sans);color:var(--ink)}
.notegroup span{font:400 10.5px/1.2 var(--sans);color:var(--ink-3)}
.notegroup .ic{margin-left:auto;width:14px;height:14px;color:var(--ink-3)}
.nlist{padding:6px 20px 0}
.note{padding:13px 0 14px;border-bottom:1px solid var(--line)}
.note .quote{border-left:2px solid var(--lamp);padding-left:10px;font:400 14.5px/24px var(--serif);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .mine{margin-top:7px;font:400 12.5px/20px var(--sans);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{display:flex;align-items:center;margin-top:8px;gap:6px;font:400 10px/1.3 var(--sans);color:var(--ink-3)}
.note .meta .go{margin-left:auto;font:500 10.5px/1.3 var(--sans);color:var(--lamp-ink);display:flex;align-items:center;gap:3px}
.note .meta .go .ic{width:11px;height:11px}
.dotsep{width:2px;height:2px;border-radius:50%;background:var(--ink-3);opacity:.6}

/* ---------- conversations ---------- */
.chatgroup{display:flex;align-items:center;gap:9px;padding:15px 20px 0}
.chatgroup .mini{width:12px;height:16px}
.chatgroup b{font:600 12.5px/1.2 var(--sans);color:var(--ink)}
.chatgroup span{font:400 10.5px/1.2 var(--sans);color:var(--ink-3)}
.chatgroup .ic{margin-left:auto;width:14px;height:14px;color:var(--ink-3)}
.chatlist{padding:4px 20px 0}
.chatrow{padding:13px 0 14px;border-bottom:1px solid var(--line)}
.chatrow h3{margin:0;font:600 15.5px/1.45 var(--serif);color:var(--ink)}
.chatrow p{margin:5px 0 0;font:400 12.5px/20px var(--sans);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chatrow .meta{margin-top:7px;font:400 10px/1.3 var(--sans);color:var(--ink-3)}

/* ---------- profile ---------- */
.pbrand{padding:18px 20px 0;display:flex;flex-direction:column;align-items:center;text-align:center}
.pmark{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 40%,var(--lamp-wash) 0%,var(--paper-deep) 68%);box-shadow:var(--shadow-1),inset 0 0 0 1px var(--line)}
.pmark .ic{width:28px;height:28px;color:var(--lamp)}
.pbrand h2{margin:13px 0 5px;font:600 22px/1.2 var(--serif);color:var(--ink);letter-spacing:.03em}
.pbrand p{margin:0;font:400 12.5px/1.6 var(--serif);color:var(--ink-2)}
.pgroup{margin:26px 20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:13px;height:56px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .sym{width:30px;height:30px;border-radius:50%;background:var(--paper-deep);display:grid;place-items:center;flex:none}
.prow .sym .ic{width:16px;height:16px;color:var(--ink-2)}
.prow .sym.lamp .ic{color:var(--lamp)}
.prow .name{font:500 14px/1.2 var(--sans);color:var(--ink)}
.prow .val{margin-left:auto;font:400 12px/1.2 var(--sans);color:var(--ink-3)}
.prow .ic.chev{width:13px;height:13px;color:var(--ink-3);margin-left:3px}
.pfoot{text-align:center;font:400 10.5px/1.6 var(--sans);color:var(--ink-3);padding:22px 20px 0}

/* ---------- specimen bits ---------- */
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{border-radius:12px;overflow:hidden;background:#FFFFFF;box-shadow:0 1px 2px rgba(33,30,24,.08)}
.sw .c{height:56px}
.sw .n{padding:8px 9px 9px;font-size:11px;font-weight:600}
.sw .n small{display:block;font-size:9.5px;font-weight:400;opacity:.55;margin-top:2px;letter-spacing:.04em}

.icogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}

.icotile .ic{width:22px;height:22px}
.icotile span{font-size:9px;opacity:.5}
.coverrow{display:flex;gap:22px;align-items:flex-start}

.covercell .cover{width:120px;height:168px}

.iconrow{display:flex;gap:34px;align-items:flex-start}
.iconcell{display:flex;flex-direction:column;align-items:center;gap:12px}
.appicon{width:180px;height:180px;border-radius:40px;overflow:hidden;box-shadow:0 20px 44px -18px rgba(30,25,18,.45),0 0 0 1px rgba(20,16,10,.08)}

.iconcell span{font-size:10.5px;opacity:.55;text-align:center;max-width:190px;line-height:1.5}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px 32px;margin:0;padding:0;list-style:none}

.kbd{font:500 10.5px/1 var(--sans);letter-spacing:.06em;background:#F2EDE2;padding:4px 7px;border-radius:5px;color:#57534A}

function palette(){
  const light=[
    ['纸 paper','#FAF7F1'],['纸深 paper-deep','#F2EDE2'],['表面 surface','#FFFFFF'],
    ['墨 ink','#211E18'],['墨二 ink-2','#57534A'],['墨三 ink-3','#6E6A60'],
    ['线 line','#E7E0D2'],['灯 lamp','#B4712A'],['灯文 lamp-ink','#8A5413'],
    ['灯晕 lamp-wash','#F6E7CC'],['选文 selection','#F2DBA6'],['错误 error','#A63A2B']
  ];
  const dark=[
    ['纸 paper','#1B1A17'],['纸深 paper-deep','#24221E'],['表面 surface','#2A2723'],
    ['墨 ink','#F3EEE3'],['墨二 ink-2','#C3BCAE'],['墨三 ink-3','#948D80'],
    ['线 line','#3A362F'],['灯 lamp','#E0AE6A'],['灯文 lamp-ink','#F0C98B'],
    ['灯晕 lamp-wash','#3A2F1F'],['选文 selection','#5A4A2A'],['错误 error','#F0A79A']
  ];
  function grid(rows,dark){
    const card = dark ? 'background:#24221E;color:#F3EEE3' : 'background:#FFFFFF;color:#211E18';
    return '<div class="swgrid">'+rows.map(function(r){return '<div class="sw" style="'+card+'"><div class="c" style="background:'+r[1]+'"></div><div class="n">'+r[0]+'<small>'+r[1].toUpperCase()+'</small></div></div>';}).join('')+'</div>';
  }
  return '<h2 class="sword">01 · 颜色</h2>'+
  '<p class="snote">三层底色（纸 / 纸深 / 表面）+ 三层文字（墨 / 墨二 / 墨三）+ 一个暖灯色。暖灯色只用于“灯”：AI、引用、进度、选中；不用于大面积背景。所有正文与元信息都满足 4.5:1 对比度。</p>'+
  '<div class="panel"><h3>浅色</h3>'+grid(light,false)+'</div>'+
  '<div class="panel" style="margin-top:16px;background:#1B1A17;color:#F3EEE3"><h3 style="color:#F3EEE3">深色</h3>'+grid(dark,true)+'</div>';
}

  '<div class="panel"><h3>界面字号（宋体标题 · 无衬线正文）</h3><div class="typescale">'+
    '<div class="trow"><span class="lab">display 30/38 · 宋 600</span><span class="demo" style="font:600 30px/1.25 \'Songti SC\',serif">书架 · 笔记 · 对话</span></div>'+
    '<div class="trow"><span class="lab">title 22/30 · 宋 600</span><span class="demo" style="font:600 22px/1.35 \'Songti SC\',serif">红楼梦 · 继续阅读</span></div>'+
    '<div class="trow"><span class="lab">headline 17/26 · 宋 600</span><span class="demo" style="font:600 17px/1.4 \'Songti SC\',serif">我的书籍 · 这句话里的“灯”指什么？</span></div>'+
    '<div class="trow"><span class="lab">body 15/24 · 系统 400</span><span class="demo" style="font:400 15px/1.6 -apple-system,\'PingFang SC\'">“老母”指贾母，也就是黛玉的外祖母。上文说黛玉“便知是他外祖母”。</span></div>'+
    '<div class="trow"><span class="lab">subhead 13/20 · 系统 500</span><span class="demo" style="font:500 13px/1.5 -apple-system,\'PingFang SC\'">接着读 · 回到原文 · 一本书的第二次打开</span></div>'+
    '<div class="trow"><span class="lab">footnote 12/18 · 系统 400</span><span class="demo" style="font:400 12px/1.5 -apple-system,\'PingFang SC\';opacity:.75">曹雪芹 · 第三回 · 今天 13:37</span></div>'+
    '<div class="trow"><span class="lab">caption 10.5/16 · 系统 500</span><span class="demo" style="font:500 10.5px/1.5 -apple-system,\'PingFang SC\';letter-spacing:.08em;opacity:.6">继续阅读 · 书内依据 · 已读 12%</span></div>'+

  '</div></div>';
}

function covers(){

  '<div class="panel"><div class="coverrow">'+

  '</div><p class="snote" style="margin:16px 0 0">回退封面只用于“这本书没有封面”的少数情况；占位比例固定 2:2.8，书名最多两行。</p></div>';
}

  function tile(src,label){
    return '<div class="iconcell"><div class="appicon"><img src="'+src+'" alt=""></div><span>'+label+'</span></div>';
  }
  return '<h2 class="sword">06 · 应用图标</h2>'+
  '<p class="snote">保留原灯泡图形，只换配色：纸底、暖灯色灯泡、墨色灯座，灯泡内部加一层暖光灯晕。A 为确认方案；B 仅把底色换成纸色（最接近原版）；C 是墨底纸灯的深色版，供备选。</p>'+
  '<div class="panel"><div class="iconrow">'+
    tile(A,'A · 确认：纸底 + 暖灯色灯泡 + 墨色灯座 + 暖光灯晕')+
    tile(B,'B · 最接近原版：纸底 + 墨色灯泡')+
    tile(C,'C · 深色版：墨底 + 纸色灯泡 + 暖光灯晕')+
  '</div><p class="snote" style="margin:16px 0 0">1024 × 1024，无文字；圆角由系统裁切，图标本身不做圆角。原图形来源与授权见 ADR-0001。</p></div>';
}

function rules(){
  const items=[
    '一页一个主角：原文、书封或读者的问题；其余元素退到纸面。',
    '层级靠字号、颜色、留白，不靠线框和阴影堆叠。',
    '暖灯色只属于“灯”：AI、引用、进度、选中；其余保持中性。',
    '宋体负责“书”，无衬线负责“工具”，同一层级不混用。',
    '所有数值来自有限刻度：4pt 间距、7 级字号、4 档圆角、2 档阴影。',
    '删掉常驻的品牌行与解释句；解释放进空状态、详情页和首次使用。',
    '按压只改透明度，不位移、不缩放布局；尊重“减少动态效果”。',
    '深色不是反色：纸是 #1B1A17，墨是 #F3EEE3，暖灯更亮但不发光。'
  ];
  return '<h2 class="sword">07 · 八条原则</h2><div class="panel"><ul class="rules">'+items.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>';
}

function a11y(){
  return '<h2 class="sword">08 · 动效与无障碍</h2>'+
  '<div class="two-col"><div class="panel"><h3>动效</h3><ul class="rules" style="grid-template-columns:1fr">'+
    '<li>标准过渡 200ms，面板进入 260ms，缓动 cubic-bezier(.2,.7,.2,1)。</li>'+
    '<li>按压：透明度 0.72，不缩放布局；长按选中不抖动。</li>'+
    '<li>生成中：灯点 1.8s 呼吸；关闭动效时直接切换静态状态。</li>'+
    '<li>阅读页控件显隐沿用现有 200ms 覆盖式淡入淡出，正文不动、不分页。</li>'+
  '</ul></div><div class="panel"><h3>无障碍</h3><ul class="rules" style="grid-template-columns:1fr">'+
    '<li>正文 ink/paper 15.5:1，元信息 ink-3/paper 5.0:1（浅色）；深色均 ≥ 4.5:1。</li>'+
    '<li>视觉 36pt 的头部圆钮保留 44 × 44pt 触控区；底栏每格 ≥ 48pt。</li>'+
    '<li>选中状态同时用填充图标 + 墨色文字，不只靠颜色。</li>'+
    '<li>字号走 UIFontMetrics；阅读字号仍由阅读设置单独控制。</li>'+
    '<li>图标全部有 accessibilityLabel；装饰性灯点从无障碍树隐藏。</li>'+
  '</ul></div></div>';
}

/* ============================================================
   5. boards + doc
   ============================================================ */
function boardSection(title, note, theme, widthClass, screenKeys){
  const cards = screenKeys.map(function(k){
    const s = SCREENS[k];
    return '<figure class="dev"><figcaption>'+s.label+'</figcaption><div class="phone" data-theme="'+theme+'" '+(widthClass?'data-size="390"':'')+'>'+s.build()+(widthClass?'<div class="home"></div>':'')+'</div></figure>';
  }).join('');
  return '<section class="board-section"><div class="board-head"><h2>'+title+'</h2><p>'+note+'</p></div><div class="board'+(widthClass?' w390':'')+'">'+cards+'</div></section>';
}

function docHeader(){
  return '<header><h1>书灯 · 视觉系统 v1</h1>'+
  '<p class="lede">“纸与灯” / Paper &amp; Lamp。以纸为底、墨为字、暖灯为唯一强调色：宋体承担“书”，系统字体承担“工具”。这一版把上一版分散的 9 档圆角、10 多档字号和满屏灰线收敛成一套可复用的刻度，并把品牌从“黑白灯泡线稿”换成一盏有温度的灯。</p>'+
  '<div class="doc-meta">2026-10-27 · 设计基准草案 · 375 × 667 与 390 × 844 · 浅色 / 深色</div>'+
  '<div class="chips-row" style="margin-top:16px"><span class="tag">纸 #FAF7F1</span><span class="tag">墨 #211E18</span><span class="tag">灯 #B4712A</span><span class="tag">宋体标题</span><span class="tag">7 + 2 字号</span><span class="tag">4 档圆角</span><span class="tag">2 档阴影</span></div></header>';
}

function boardsAll(){
  return boardSection('375 × 667 · 浅色','四栏根页面 + 阅读 + 问答面板；SE 首屏就能看到第一排书名。','light',false,['shelf','notes','chats','profile','reader','ask'])+
         boardSection('375 × 667 · 深色','深色用暖黑而不是纯黑，暖灯色整体提亮。','dark',false,['shelf','notes','chats','profile','reader','ask'])+
         boardSection('390 × 844 · 浅色','同一套刻度在更大屏幕上只增加留白，不增加字号档位。','light',true,['shelf','reader','ask']);
}

function pageDoc(which){
  let html = '';
  if (which === 'specimen'){
    const part = new URLSearchParams(location.search).get('part') || 'all';
    const chunks = {
      p1: docHeader()+palette()+typography(),
      p2: metrics()+covers(),
      p3: icons()+iconconcepts()+rules()+a11y()
    };
    html = '<div class="doc">'+(chunks[part] || (docHeader()+palette()+typography()+metrics()+covers()+icons()+iconconcepts()+rules()+a11y()))+'</div>';
  } else if (which === 'light375'){
    html = '<div class="doc">'+boardSection('375 × 667 · 浅色','四栏根页面 + 阅读 + 问答面板；SE 首屏就能看到第一排书名。','light',false,['shelf','notes','chats','profile','reader','ask'])+'</div>';
  } else if (which === 'dark375'){
    document.body.classList.add('doc-dark');
    html = '<div class="doc doc-dark">'+boardSection('375 × 667 · 深色','深色用暖黑而不是纯黑，暖灯色整体提亮。','dark',false,['shelf','notes','chats','profile','reader','ask'])+'</div>';
  } else if (which === 'light390'){
    html = '<div class="doc">'+boardSection('390 × 844 · 浅色','同一套刻度在更大屏幕上只增加留白，不增加字号档位。','light',true,['shelf','reader','ask'])+'</div>';
  } else if (which === 'icons'){
    html = '<div class="doc">'+iconconcepts()+'</div>';
  } else {
    html = '<div class="doc">'+docHeader()+rules()+palette()+typography()+metrics()+covers()+icons()+iconconcepts()+
      '<h2 class="sword">09 · 页面</h2><p class="snote">全部页面按同一套刻度重排：书架去掉常驻品牌行与三行说明；笔记/对话去掉解释句、筛选改成轻量胶囊；我的页把品牌集中成一个暖光标记。</p>'+
      boardsAll()+a11y()+'</div>';
  }
  document.getElementById('app').innerHTML = html;
}

function solo(){
  const p = new URLSearchParams(location.search);
  const key = p.get('solo');
  if (!key) return false;
  document.body.classList.add('solo');
  if (key === 'doc'){ document.body.classList.remove('solo'); pageDoc(p.get('part')||'all'); return true; }
  const job = SCREENS[key];
  if (!job) return false;
  const theme = p.get('theme') || 'light';
  const w = p.get('w') || '375';
  const h = p.get('h') || '667';
  document.body.dataset.theme = theme;
  document.getElementById('app').innerHTML =
    '<div class="phone" data-theme="'+theme+'" data-size="'+(w==='390'?'390':'375')+'" style="width:'+w+'px;height:'+h+'px">'+job.build()+(w==='390'?'<div class="home"></div>':'')+'</div>';
  return true;
}

if (!solo()){
  const p = new URLSearchParams(location.search);
  pageDoc(p.get('board') || 'all');
}
