<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>书灯 · 覆盖式阅读控件示意</title>
<style>
:root{--paper:#fcfbf8;--ink:#282b26;--secondary:#64675f;--line:#e6e3da;--accent:#8a590d}*{box-sizing:border-box}body{margin:0;background:#f2f0e9;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:800px;margin:40px auto;padding:0 24px}h1{font-size:26px}p{line-height:1.8;color:var(--secondary)}.reader{position:relative;width:375px;max-width:100%;height:647px;margin:24px auto;background:var(--paper);overflow:hidden;border:1px solid var(--line);border-radius:16px}.text{position:absolute;inset:0;padding:29px;font:20px/1.95 'Songti SC',serif;overflow:hidden}.text p{color:var(--ink);margin:0 0 30px;text-indent:2em}header,footer{position:absolute;left:0;right:0;z-index:1;background:var(--paper);transition:opacity .2s ease}header{top:0;height:51px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}header span{font-size:13px}footer{bottom:0;height:66px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line)}button{font:inherit;color:var(--accent);border:0;background:transparent;min-width:44px;min-height:44px;cursor:pointer}footer button{border-radius:23px;color:var(--paper);background:var(--ink);padding:0 20px}.hidden header,.hidden footer{opacity:0;pointer-events:none}.tools{display:flex;justify-content:center;gap:16px}.tools button{border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paper)}.note{font-size:12px;text-align:center}@media(prefers-reduced-motion:reduce){header,footer{transition:none}}
</style>
<main><h1>正文不动，工具按需出现</h1><p>点击正文中部。工具栏与底部入口一起淡入淡出，正文位置和尺寸始终相同。这是交互示意，原生性能以模拟器验收为准。</p>
<section class="reader" aria-label="阅读控件交互示意"><article class="text"><p>窗外的树影慢慢移过书页。她把刚才那句话又读了一遍，才发现答案早已藏在前文里。</p><p>阅读并不总是急着向前。有时只是停下片刻，便能看见原先忽略的细节。</p><p>她合上手边的笔记，把注意力重新放回故事。房间里很安静，纸页翻过的声音清晰可闻。</p><p>天色渐暗，灯光在桌面上留下一小片温暖。书中的人仍在继续他们的旅程。</p><p>她继续读了下去。</p></article>
<header><button aria-label="返回">‹</button><span>阅读示意 · 第二章</span><button aria-label="目录与设置">☰</button></header>
<footer><span>34%</span><button>问问书灯</button><span>第二章</span></footer></section>
<div class="tools"><button id="toggle" aria-pressed="false">隐藏工具栏</button><button id="theme">切换主题</button></div><p class="note">固定正文 · 约 200ms 淡入淡出 · 不重新分页</p></main>
<script>
const reader=document.querySelector('.reader'),toggle=document.querySelector('#toggle');function flip(){const hidden=reader.classList.toggle('hidden');toggle.textContent=hidden?'显示工具栏':'隐藏工具栏';toggle.setAttribute('aria-pressed',String(hidden));reader.querySelectorAll('header button,footer button').forEach(x=>x.tabIndex=hidden?-1:0);reader.querySelectorAll('header,footer').forEach(x=>x.setAttribute('aria-hidden',String(hidden)))}reader.querySelector('.text').addEventListener('click',flip);toggle.addEventListener('click',flip);let dark=false;document.querySelector('#theme').addEventListener('click',()=>{dark=!dark;for(const[k,v]of Object.entries(dark?{paper:'#20231f',ink:'#f0f1e9',secondary:'#c0c4b8',line:'#3d4338',accent:'#edc579'}:{paper:'#fcfbf8',ink:'#282b26',secondary:'#64675f',line:'#e6e3da',accent:'#8a590d'}))document.documentElement.style.setProperty('--'+k,v)});
</script></html>
