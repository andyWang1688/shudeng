  <rect width="960" height="180" rx="18" fill="#f7f3eb"/>
  <g font-family="Songti SC, STSong, serif" font-size="17" fill="#2c2a26">
    <rect x="28" y="58" width="190" height="64" rx="12" fill="#fffaf0" stroke="#c9b998"/>
    <text x="123" y="83" text-anchor="middle">① 你选中文字/提问</text>
